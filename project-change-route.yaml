# Reference route. The parent retargets coding blocks to real disjoint write
# sets and removes blocks whose evidence is already satisfied before start.
title: "Project change: explore → plan → build → verify → review"
config:
  name: project-change-route
  max_concurrency: 4
  max_node_replan_attempts: 3
  max_total_nodes: 24
  node_defaults:
    worker_config:
      timeout_ms: 1800000
  objective: >-
    Deliver the confirmed project-level source and test change through bounded
    work packages, deterministic verification, and evidence-backed review.
  blocks:
    - id: map-existing
      kind: explore
      instruction: >-
        Map current behavior, ownership boundaries, repository rules, relevant
        tests, and integration seams. Resolve discoverable facts and identify
        only runnable or user-owned uncertainties.

    - id: implementation-contract
      kind: plan
      depends_on: [map-existing]
      instruction: >-
        Turn the confirmed brief into the smallest implementation path. Define
        disjoint write sets, dependency order, interface contracts, acceptance
        checks, rollback concerns, and the evidence each package must return.

    - id: production-slice
      kind: coding
      depends_on: [implementation-contract]
      skills: [tdd]
      instruction: >-
        Own only the retargeted production write set. Work test-first where the
        repository permits it and stop if another block owns the same files.

    - id: integration-slice
      kind: coding
      depends_on: [implementation-contract]
      skills: [tdd]
      instruction: >-
        Own only the retargeted integration or consumer write set. Preserve the
        planned interfaces and report any contract drift instead of redesigning
        another block's module.

    - id: acceptance-slice
      kind: coding
      depends_on: [implementation-contract]
      skills: [tdd]
      instruction: >-
        Own the independent acceptance-test write set. Test observable behavior
        and failure paths without duplicating implementation logic.

    - id: project-checks
      kind: verify
      depends_on: [production-slice, integration-slice, acceptance-slice]
      instruction: >-
        Run the smallest complete documented gate set for every affected package,
        including generated-artifact or contract checks when applicable.

    - id: delivery-decision
      kind: review
      depends_on: [project-checks]
      skills: [code-review]
      instruction: >-
        Verify both repository standards and the confirmed acceptance criteria.
        Treat unsupported claims, overlapping writes, stale generated output, and
        failing required checks as material findings.

    - id: delivery-report
      kind: synthesize
      depends_on: [delivery-decision]
      instruction: >-
        Report changed modules, exact checks and results, acceptance coverage,
        residual risks, and any follow-up that was deliberately left out.
