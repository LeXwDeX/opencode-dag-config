# Reference route. The parent retargets coding blocks to real disjoint write
# sets and removes blocks whose evidence is already satisfied before start.
title: "Project change: evidence → codebase design → coding → verify → global review"
config:
  name: project-change-route
  max_concurrency: 4
  max_node_replan_attempts: 3
  max_total_nodes: 24
  node_defaults:
    worker_config:
      timeout_ms: 1800000
  objective: >-
    Deliver the confirmed project-level source and test change through bounded
    work packages, deterministic verification, and evidence-backed review.
  blocks:
    - id: map-existing
      kind: explore
      instruction: >-
        Map current behavior, ownership boundaries, repository rules, relevant
        tests, and integration seams. Resolve discoverable facts and identify
        only runnable or user-owned uncertainties.

    - id: codebase-design
      kind: plan
      depends_on: [map-existing]
      instruction: >-
        Turn the confirmed brief into the smallest deep design: place behavior
        behind a narrow owning interface, use the repository's domain language,
        and define disjoint write sets, dependency order, migration boundaries,
        acceptance checks, falsifiers, and the evidence each package returns.

    - id: production-slice
      kind: coding
      depends_on: [codebase-design]
      instruction: >-
        Own only the retargeted production write set. Establish a failing
        observable check before production changes when a test seam exists,
        return it to green, refactor under that check, and stop if another block
        owns the same files.

    - id: integration-slice
      kind: coding
      depends_on: [codebase-design]
      instruction: >-
        Own only the retargeted integration or consumer write set. Preserve the
        planned interfaces, test observable consumer behavior before changing
        it, and report contract drift instead of redesigning another block's
        module.

    - id: acceptance-slice
      kind: coding
      depends_on: [codebase-design]
      instruction: >-
        Own the independent acceptance-test write set. Test observable behavior
        and failure paths first without duplicating implementation logic; keep
        the checks red until the corresponding production behavior exists.

    - id: project-checks
      kind: verify
      depends_on: [production-slice, integration-slice, acceptance-slice]
      instruction: >-
        Run the smallest complete documented gate set for every affected package,
        including generated-artifact or contract checks when applicable.

    - id: global-review
      kind: review
      depends_on: [project-checks]
      instruction: >-
        Review the entire changed surface on independent Standards and Intent
        axes. Verify repository architecture, correctness, and generated-output
        rules separately from the confirmed goal and acceptance criteria. Treat
        unsupported claims, overlapping writes, stale evidence, and failing
        required checks as material findings.

    - id: delivery-report
      kind: synthesize
      depends_on: [global-review]
      instruction: >-
        Report changed modules, exact checks and results, acceptance coverage,
        residual risks, and any follow-up that was deliberately left out.
