title: "Bug repair: reproduce → diagnose → repair → verify → review"
config:
  name: debug-repair-route
  max_concurrency: 3
  max_node_replan_attempts: 3
  max_total_nodes: 18
  node_defaults:
    worker_config:
      timeout_ms: 1800000
  objective: >-
    Reproduce the confirmed bug, establish an evidence-backed root cause,
    implement the narrowest safe repair, and prove it with a regression check.
  blocks:
    - id: root-cause
      kind: debug
      instruction: >-
        Start from the exact reported symptom. Make the feedback loop fail on
        demand, minimize it, rank falsifiable hypotheses, instrument the boundary
        that distinguishes them, and retain commands, logs, and file references.
        Stop if evidence does not establish a cause.

    - id: repair
      kind: coding
      depends_on: [root-cause]
      instruction: >-
        Add a failing regression check for the established cause, implement only
        the minimal production repair, return that check to green, refactor only
        under the passing check, and avoid unrelated cleanup.

    - id: regression-checks
      kind: verify
      depends_on: [repair]
      instruction: >-
        Re-run the original reproduction, the focused regression check, and the
        affected package gates. State whether the causal hypothesis was falsified
        or supported by the result.

    - id: repair-decision
      kind: review
      depends_on: [regression-checks]
      instruction: >-
        Review Standards and Intent independently. Check that the diff addresses
        the proven cause, the regression test would fail without the fix, and no
        broader behavior changed without evidence.

    - id: repair-report
      kind: synthesize
      depends_on: [repair-decision]
      instruction: >-
        Summarize symptom, root cause, repaired boundary, regression evidence, and
        remaining uncertainty.
