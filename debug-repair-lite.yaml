# Lightweight reference for a deterministic, bounded defect.
title: "Debug and repair (lite): reproduce → fix → verify"
config:
  name: debug-repair-lite
  max_concurrency: 1
  max_node_replan_attempts: 2
  max_total_nodes: 10
  node_defaults:
    worker_config:
      timeout_ms: 1800000
  objective: >-
    Repair one reproducible defect through a minimal causal patch and regression check.
  blocks:
    - id: lite-reproduce
      kind: debug
      instruction: >-
        Reproduce and minimize the exact symptom with one deterministic command.
        Establish the causal boundary and record unresolved hypotheses,
        concurrency, production-only state, or cross-module scope.

    - id: lite-repair-gate
      kind: review
      depends_on: [lite-reproduce]
      report_to_parent: true
      instruction: >-
        Decide whether the evidence still satisfies this lite workflow's bounded,
        reversible, single-owner, no-high-risk premises. Return ACCEPT only when
        it does. Otherwise return REVISE or BLOCKED with exact reasons and
        required actions. Do not name another workflow; the parent Router owns
        route and control changes.

    - id: lite-repair
      kind: coding
      depends_on: [lite-repair-gate]
      instruction: >-
        Add the failing regression at the real seam, implement only the proven
        fix, make the check pass, and avoid unrelated cleanup.

    - id: lite-repair-verify
      kind: verify
      depends_on: [lite-repair]
      instruction: >-
        Re-run the original symptom, regression check, and affected package gate.
        Record cause, commands, results, and residual uncertainty.
