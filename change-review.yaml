title: Change review (composable blocks)
config:
  name: change-review
  max_concurrency: 3
  node_defaults:
    worker_config:
      timeout_ms: 1800000
  objective: >-
    Review the uncommitted changes in this repository against documented
    standards and the confirmed request, using repository evidence and the
    relevant package checks. Do not modify files.
  blocks:
    - id: survey
      kind: explore
      instruction: >-
        Inspect git status, the complete diff, repository instructions, and the
        modules touched. Record the intended behavior, affected seams, and
        concrete file references. Do not review from a partial diff.

    - id: verify
      kind: verify
      depends_on: [survey]
      instruction: >-
        Run the repository's documented commit gates from the correct package
        directories. Report exact commands and raw failures; do not fix them.

    - id: decision
      kind: review
      depends_on: [survey, verify]
      instruction: >-
        Review the bounded diff on independent Standards and Intent axes. Treat
        failing required checks as blockers, bind findings to the verified
        implementation state, drop claims without a specific code or command
        reference, deduplicate overlaps, and distinguish merge blockers from
        optional improvements.
